<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">AI Robot Fleet Coordinator architecture</title>
<desc id="desc">Mission and robot-state inputs pass through domain validation, fleet coordination, A-star path planning and battery reserve checks before a structured assignment is returned.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081323"/><stop offset="1" stop-color="#111f35"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#36d6cf"/><stop offset="1" stop-color="#8af0d5"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#64dcd5"/></marker>
</defs>
<rect width="1200" height="480" rx="24" fill="url(#bg)"/>
<text x="56" y="58" fill="#f5f8ff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">MISSION PLANNING PIPELINE</text>
<text x="56" y="86" fill="#98abc5" font-family="Inter,Arial,sans-serif" font-size="13">Deterministic planning core · simulation only · no hardware actuation</text>
<g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
  <rect x="48" y="160" width="190" height="150" rx="18" fill="#152844" stroke="#2c4567"/>
  <rect x="48" y="160" width="190" height="6" rx="3" fill="url(#cyan)"/>
  <text x="70" y="204" fill="#6fe4dc" font-size="12" font-weight="700">01 · INPUT</text>
  <text x="70" y="238" fill="#f5f8ff" font-size="19" font-weight="700">Mission +</text>
  <text x="70" y="264" fill="#f5f8ff" font-size="19" font-weight="700">Robot State</text>
  <text x="70" y="288" fill="#9fb0c8" font-size="12">Positions · battery · payload</text>

  <rect x="282" y="160" width="190" height="150" rx="18" fill="#152844" stroke="#2c4567"/>
  <rect x="282" y="160" width="190" height="6" rx="3" fill="url(#cyan)"/>
  <text x="304" y="204" fill="#6fe4dc" font-size="12" font-weight="700">02 · DOMAIN</text>
  <text x="304" y="238" fill="#f5f8ff" font-size="19" font-weight="700">Validated</text>
  <text x="304" y="264" fill="#f5f8ff" font-size="19" font-weight="700">Models</text>
  <text x="304" y="288" fill="#9fb0c8" font-size="12">Types · ranges · statuses</text>

  <rect x="516" y="160" width="190" height="150" rx="18" fill="#152844" stroke="#2c4567"/>
  <rect x="516" y="160" width="190" height="6" rx="3" fill="url(#cyan)"/>
  <text x="538" y="204" fill="#6fe4dc" font-size="12" font-weight="700">03 · PLANNING</text>
  <text x="538" y="238" fill="#f5f8ff" font-size="19" font-weight="700">Fleet</text>
  <text x="538" y="264" fill="#f5f8ff" font-size="19" font-weight="700">Coordinator</text>
  <text x="538" y="288" fill="#9fb0c8" font-size="12">Eligibility · route ranking</text>

  <rect x="750" y="160" width="190" height="150" rx="18" fill="#152844" stroke="#2c4567"/>
  <rect x="750" y="160" width="190" height="6" rx="3" fill="url(#cyan)"/>
  <text x="772" y="204" fill="#6fe4dc" font-size="12" font-weight="700">04 · CONSTRAINTS</text>
  <text x="772" y="238" fill="#f5f8ff" font-size="19" font-weight="700">A* + Battery</text>
  <text x="772" y="264" fill="#f5f8ff" font-size="19" font-weight="700">Feasibility</text>
  <text x="772" y="288" fill="#9fb0c8" font-size="12">Static grid · reserve check</text>

  <rect x="984" y="160" width="168" height="150" rx="18" fill="#12323b" stroke="#2b7775"/>
  <rect x="984" y="160" width="168" height="6" rx="3" fill="url(#cyan)"/>
  <text x="1006" y="204" fill="#75eee0" font-size="12" font-weight="700">05 · OUTPUT</text>
  <text x="1006" y="238" fill="#f5f8ff" font-size="19" font-weight="700">Assignment</text>
  <text x="1006" y="264" fill="#f5f8ff" font-size="19" font-weight="700">or Rejection</text>
  <text x="1006" y="288" fill="#a8c9cf" font-size="12">JSON · terminal map</text>
</g>
<g stroke="#64dcd5" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
  <path d="M240 235 H274"/><path d="M474 235 H508"/><path d="M708 235 H742"/><path d="M942 235 H976"/>
</g>
<rect x="48" y="360" width="1104" height="66" rx="14" fill="#0b192b" stroke="#263c5a"/>
<text x="72" y="388" fill="#6fe4dc" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">SAFETY BOUNDARY</text>
<text x="72" y="408" fill="#c4d0e3" font-family="Inter,Arial,sans-serif" font-size="14">Planning output only. Fresh telemetry, reservation, revalidation and safety-rated control are required before any real dispatch.</text>
</svg>